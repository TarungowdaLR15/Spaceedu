<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpaceEdu — Explorer</title>
<style>
  :root { --bg: #04101f; --text: #fff; --cyan: #79dce8; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0; padding: 40px; display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
  }
  header { text-align: center; margin-bottom: 30px; }
  h1 { color: var(--cyan); font-size: 2.5rem; margin: 0 0 10px 0; font-family: 'Prata', serif; }
  a { color: inherit; text-decoration: none; }
  a:hover { opacity: 0.8; }
  p { opacity: 0.7; margin: 0; }
  
  .search-bar {
    width: 100%; max-width: 600px; padding: 15px 20px;
    border-radius: 30px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05); color: white; font-size: 1rem; outline: none;
    margin-bottom: 40px; transition: border 0.3s;
  }
  .search-bar:focus { border-color: var(--cyan); }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px; width: 100%; max-width: 1000px;
  }

  .card {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; padding: 20px; transition: transform 0.2s, background 0.2s;
    cursor: pointer;
  }
  .card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.08); }
  .card h2 { margin: 0 0 10px 0; font-size: 1.2rem; }
  .card .kind { 
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;
    color: var(--cyan); font-weight: bold; margin-bottom: 10px; display: block;
  }
  .card p { font-size: 0.9rem; margin: 0; opacity: 0.8; line-height: 1.4; }
</style>
</head>
<body>

  <header>
    <h1><a href="/">&larr; SpaceEdu Explorer</a></h1>
    <p>Search all known planets, moons, stars, comets, and exoplanets.</p>
  </header>

  <input type="text" class="search-bar" id="searchInput" placeholder="Search the cosmos (e.g., 'Kepler', 'Mars', 'Moon')...">

  <div class="grid" id="resultsGrid">
    <!-- Data will be injected here -->
  </div>

  <script>
    const grid = document.getElementById('resultsGrid');
    const searchInput = document.getElementById('searchInput');

    async function fetchBodies(query = '') {
      try {
        const url = query ? `/api/bodies?q=${encodeURIComponent(query)}` : '/api/bodies';
        const response = await fetch(url);
        const data = await response.json();
        
        grid.innerHTML = '';

        if (data.length === 0) {
          grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No bodies found in this sector of the galaxy.</p>';
          return;
        }

        data.forEach(body => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <span class="kind">${body.kind.replace('_', ' ')}</span>
            <h2>${body.name}</h2>
            <p>${body.description || 'No description available.'}</p>
          `;
          grid.appendChild(card);
        });
      } catch (error) {
        console.error('Error fetching data:', error);
        grid.innerHTML = '<p style="color: red; grid-column: 1/-1; text-align: center;">Failed to connect to the backend.</p>';
      }
    }

    fetchBodies();

    let timeout = null;
    searchInput.addEventListener('input', (e) => {
      clearTimeout(timeout);
      timeout = setTimeout(() => {
        fetchBodies(e.target.value);
      }, 300);
    });
  </script>
</body>
</html>
